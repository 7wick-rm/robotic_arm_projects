# Single config for the 5 trainings. Fill the <...> values. Nothing else needs editing for a normal run.

hf_user: "<your-hf-username>"          # trained models are pushed to <hf_user>/<name>   (token needs WRITE access)
video_backend: torchcodec              # torchcodec (fast) | pyav (fallback if torchcodec fails to import)

# Hardware profile: Brev NVIDIA L40S 48 GB, 16 vCPU, 128 GB RAM.
hardware:
  num_workers: 12                      # dataloader workers (16 CPUs; keep 4 free for the main process / uploads)
  mixed_precision: bf16                # L40S has bf16 tensor cores: ~1.5-2x faster than fp32 and halves activation memory

# Time sharing. Each model gets   remaining_time * weight / sum(weights of models still to train).
# Steps are NOT fixed: train_all.py measures real speed and picks the number of steps that fits the slot.
defaults:
  smolvla:                             # --policy.type=smolvla (NOT smolvla_base): architecture from config, no pretrained SmolVLA weights
    pretrained: null                   # set e.g. "lerobot/smolvla_base" ONLY if you later want to fine-tune it (then camera renaming is needed)
    load_vlm_weights: true             # load the pretrained SmolVLM2-500M backbone; without this the VLM is random (config default is false)
    batch_size: 32                     # Auto-halved on OOM.
    lr: 1.0e-4                         # SmolVLA default
    min_steps: 3000
    max_steps: 40000                   # expert trained from scratch converges slower than a fine-tune: let the time budget decide
    return_uint8: true                 # cheaper dataloader IPC; set false if you see dtype errors
  act:
    batch_size: 32
    lr: 2.0e-5                         # ACT default is 1e-5 @ bs8; ~sqrt scaling for bs32
    min_steps: 5000
    max_steps: 80000
    return_uint8: true

models:                                # keys = the ids used in the deployment workspaces.yaml
  screw:       {policy: act,     dataset: "<user>/<screw-dataset>",       weight: 0.8}
  hammer:      {policy: smolvla, dataset: "<user>/<hammer-dataset>",      weight: 1.0}
  wrench:      {policy: smolvla, dataset: "<user>/<wrench-dataset>",      weight: 1.0}
  burger:      {policy: smolvla, dataset: "<user>/<burger-dataset>",      weight: 1.0}
  thor_hammer: {policy: smolvla, dataset: "<user>/<thor-hammer-dataset>", weight: 1.0}

# Optional per-model overrides, e.g.:
#   hammer: {policy: smolvla, dataset: ..., weight: 1.2, batch_size: 48, max_steps: 12000}
