# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - base_link_Revolute-107
      - DOF1motor_Revolute-110
      - dof_link_1_motor_Revolute-111
      - dof_link_1_motor-1_Revolute-112
      - dof_5_link-1_Revolute-113
      - dof_6_ass_Revolute-114
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
gripper_controller:
  ros__parameters:
    joints:
      - gripper_withoutarm_part_Slider-116
      - gripper_withoutarm_part_Slider-121
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity