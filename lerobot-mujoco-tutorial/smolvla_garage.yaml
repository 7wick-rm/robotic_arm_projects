dataset:
  repo_id: garage_pnp
  root: ./demo_data_garage            # Colab: /content/drive/MyDrive/garage/demo_data_garage
policy:
  type: smolvla
  chunk_size: 10
  n_action_steps: 10
  device: cuda
  use_amp: false                      # T4 has no bf16
output_dir: ./ckpt/smolvla_garage     # Colab: put this on Drive so a disconnect doesn't lose checkpoints
batch_size: 8                         # 8 if you hit CUDA OOM
job_name: smolvla_garage
resume: false                         # true + same output_dir to continue after a Colab disconnect
seed: 42
num_workers: 2
steps: 15_000
eval_freq: -1
log_freq: 50
save_checkpoint: true
save_freq: 2_500
use_policy_training_preset: true
wandb:
  enable: false
