# ros2_control config for real-hardware test mode (real_hw_test:=true)
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Real: Joint3 (BLDC) + Joint4, Joint5 (AX-18A). One controller spanning both
    # hardware components so the three joints get a single, synchronised goal.
    arm_servo_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Mocked: Joint1, Joint2
    mock_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Real: Jaw (AX-18A). Jaw2 follows via <mimic> in the URDF.
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_servo_controller:
  ros__parameters:
    joints:
      - Joint3
      - Joint4
      - Joint5
    command_interfaces:
      - position
    state_interfaces:
      - position

mock_arm_controller:
  ros__parameters:
    joints:
      - Joint1
      - Joint2
    command_interfaces:
      - position
    state_interfaces:
      - position

gripper_controller:
  ros__parameters:
    joints: 
      - Jaw
    command_interfaces:
      - position
    state_interfaces:
      - position
    # The STM stops closing on load, so the finger legitimately ends short of the
    # commanded position when it holds an object. Do not check final-position tolerance.
    constraints:
      goal_time: 0.0
      stopped_velocity_tolerance: 0.0
      Jaw:
        trajectory: 0.0
        goal: 0.0