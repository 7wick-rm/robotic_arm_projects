# ros2_control config for real-hardware test mode (real_hw_test:=true)
# Used with a standalone ros2_control_node, no Gazebo involved.
controller_manager:
  ros__parameters:
    update_rate: 20  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Real hardware: Joint1, Joint2 (arm_servo_controller/ArmServoHardware)
    arm_servo_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Mocked: Joint3, Joint4, Joint5 (mock_components/GenericSystem)
    mock_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Mocked: Jaw, Jaw2 (mock_components/GenericSystem)
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


joint_state_broadcaster:
  ros__parameters:
    publish_rate: 20

arm_servo_controller:
  ros__parameters:
    joints:
      - Joint4
      - Joint5
    command_interfaces:
      - position
    state_interfaces:
      - position

mock_arm_controller:
  ros__parameters:
    joints:
      - Joint1
      - Joint2
      - Joint3
    command_interfaces:
      - position
    state_interfaces:
      - position

gripper_controller:
  ros__parameters:
    joints:
      - Jaw
      - Jaw2
    command_interfaces:
      - position
    state_interfaces:
      - position
