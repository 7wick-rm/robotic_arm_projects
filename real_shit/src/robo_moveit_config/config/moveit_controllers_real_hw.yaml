# MoveIt controller config for real-hardware test mode (real_hw_test:=true)
# The single "arm" planning group (Joint1..Joint5) is split across two
# FollowJointTrajectory controllers; moveit_simple_controller_manager
# automatically sends each controller only the sub-trajectory for its
# own joints.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_servo_controller
    - mock_arm_controller
    - gripper_controller

  arm_servo_controller:
    type: FollowJointTrajectory
    joints:
      - Joint4
      - Joint5
    action_ns: follow_joint_trajectory
    default: true

  mock_arm_controller:
    type: FollowJointTrajectory
    joints:
      - Joint1
      - Joint2
      - Joint3
    action_ns: follow_joint_trajectory
    default: true

  gripper_controller:
    type: FollowJointTrajectory
    joints:
      - Jaw
      - Jaw2
    action_ns: follow_joint_trajectory
    default: true
