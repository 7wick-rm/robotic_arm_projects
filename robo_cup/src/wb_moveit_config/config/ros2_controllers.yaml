# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    robot1_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robot1_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robot2_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robot2_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

robot1_arm_controller:
  ros__parameters:
    joints:
      - robot1_Link_1_joint
      - robot1_Link_2_joint
      - robot1_link_3_joint
      - robot1_link_4_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

robot1_gripper_controller:
  ros__parameters:
    joints:
      - robot1_gripper_hand_1_joint
      - robot1_gripper_hand_2_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

robot2_arm_controller:
  ros__parameters:
    joints:
      - robot2_Link_1_joint
      - robot2_Link_2_joint
      - robot2_link_3_joint
      - robot2_link_4_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

robot2_gripper_controller:
  ros__parameters:
    joints:
      - robot2_gripper_hand_1_joint
      - robot2_gripper_hand_2_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity