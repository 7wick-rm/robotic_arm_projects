# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - left_hand_controller
    - right_arm_controller
    - right_hand_controller

  left_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    joints:
      - left_Base_link1-v1_Revolute-1
      - left_2ndDOFDDD-v1_Revolute-8
      - left_lnk1assm-v2_Revolute-9
      - left_lnk2_assm-v2_Revolute-10
      - left_5thDof_mnt-v2_Revolute-11
      - left_6Thdof-v2_Revolute-12
  left_hand_controller:
    type: GripperCommand
    joints:
      - left_gripperHousing-v2_Slider-13
    action_ns: gripper_cmd
    default: true

  right_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    joints:
      - right_Base_link1-v1_Revolute-1
      - right_2ndDOFDDD-v1_Revolute-8
      - right_lnk1assm-v2_Revolute-9
      - right_lnk2_assm-v2_Revolute-10
      - right_5thDof_mnt-v2_Revolute-11
      - right_6Thdof-v2_Revolute-12
  right_hand_controller:
    type: GripperCommand
    joints:
      - right_gripperHousing-v2_Slider-13
    action_ns: gripper_cmd
    default: true